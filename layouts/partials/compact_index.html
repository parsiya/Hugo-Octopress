{{- /* Partial for compact index */ -}}

<style>
table.allposts, td.allposts-date, td.allposts-title {
  border:none;
}

td.allposts-date {
  padding: 0;
  padding-inline-end: 0.5em;
}

td.allposts-title {
    font-size: 110%;
}
</style>

<div id="main">
  <div id="content">
    <div>
      <article role="article">
          <table class="allposts">
            {{ range (where site.RegularPages "Type" "in" site.Params.mainSections) }}
              {{ if .IsPage }}
                <tr>
                  <td class="allposts-date"><strong>{{ partial "date.html" (dict "Date" .Date "Format" "2006 Jan 2") }}</strong></td>
                  <td class="allposts-title"><a href="{{ .Permalink }}" title="{{ .Title }}"><bdi dir="{{ .Language.Direction }}">{{ .Title }}</bdi></a></td>
                </tr>
              {{ end }}
            {{ end }}
          </table>
      </article>
    </div>
    {{ partial "sidebar.html" . }}
  </div>
</div>
{{ partial "footer.html" . }}
